name: XMP Build

# XMP fork build pipeline (Phase 1+2).
# Based on the upstream build.yaml, trimmed to the two artifacts XMP ships:
#   - XMP Client for Windows (Win32/x86 — GTA SA is a 32-bit process)
#   - XMP Server for Linux x64
# Upstream's own build.yaml is left untouched so upstream merges stay cheap.
# On xmp-v* tags the client job also publishes XMP-Client-win32.zip +
# xmp-client-manifest.json, which the XMP Launcher client-manager downloads.

on:
  push:
    branches: [xmp/main]
    tags: ['xmp-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-windows:
    name: XMP Client (windows, win32)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        id: cache-dxfiles
        with:
          path: utils/DXFiles
          key: dxfiles-0001

      - name: Download DirectX SDK files
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Invoke-WebRequest https://mirror-cdn.multitheftauto.com/bdata/DXFiles.zip -OutFile utils/DXFiles.zip
        shell: powershell

      - name: Extract DirectX SDK files
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Expand-Archive -Path utils/DXFiles.zip -DestinationPath utils/DXFiles
        shell: powershell

      - name: Install CEF
        run: utils\premake5 install_cef

      - name: Install data files
        run: utils\premake5 install_data

      - name: Build client (release, win32)
        run: win-build.bat release win32
        shell: cmd
        env:
          DXSDK_DIR: './utils/DXFiles/'
          CI: 'true'

      - name: Compose install files
        run: utils\premake5 compose_files

      - name: Upload XMP Client artifact
        uses: actions/upload-artifact@v6
        with:
          name: XMP-Client-win32
          path: InstallFiles/
          if-no-files-found: error

      # On tags, also publish the zip + manifest the XMP Launcher's
      # client-manager consumes (see xmp-launcher/docs/client-manifest.example.json).
      - name: Package client release (zip + manifest)
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("xmp-v")
          Compress-Archive -Path InstallFiles\* -DestinationPath XMP-Client-win32.zip -CompressionLevel Optimal
          $hash = (Get-FileHash XMP-Client-win32.zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item XMP-Client-win32.zip).Length
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/XMP-Client-win32.zip"
          @{ version = $version; url = $url; sha256 = $hash; size = $size } | ConvertTo-Json | Set-Content xmp-client-manifest.json -Encoding UTF8

      - name: Attach client release to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            XMP-Client-win32.zip
            xmp-client-manifest.json

  server-linux:
    name: XMP Server (linux, x64)
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/multitheftauto/mtasa-blue-build:latest
    steps:
      - uses: actions/checkout@v6

      - name: Build server (release, x64)
        run: ./linux-build.sh --arch=x64 --config=release

      - name: Install server data files
        run: ./linux-install-data.sh

      - name: Upload XMP Server artifact
        uses: actions/upload-artifact@v6
        with:
          name: XMP-Server-linux-x64
          path: Bin/server/
          if-no-files-found: error
