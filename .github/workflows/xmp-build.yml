name: XMP Build

# XMP fork build pipeline.
# Artifacts: XMP Client (Windows, Win32/x86) + XMP Server (Linux x64).
# On xmp-v* tags both are attached to the GitHub release, and the client
# job also publishes xmp-client-manifest.json (consumed by the XMP
# Launcher client-manager; written WITHOUT a BOM — PowerShell's
# Set-Content -Encoding UTF8 adds one and breaks strict JSON parsers).

on:
  push:
    branches: [xmp/main, main]
    tags: ['xmp-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-windows:
    name: XMP Client (windows, win32)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        id: cache-dxfiles
        with:
          path: utils/DXFiles
          key: dxfiles-0001

      - name: Download DirectX SDK files
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Invoke-WebRequest https://mirror-cdn.multitheftauto.com/bdata/DXFiles.zip -OutFile utils/DXFiles.zip
        shell: powershell

      - name: Extract DirectX SDK files
        if: steps.cache-dxfiles.outputs.cache-hit != 'true'
        run: Expand-Archive -Path utils/DXFiles.zip -DestinationPath utils/DXFiles
        shell: powershell

      - name: Install CEF
        run: utils\premake5 install_cef

      - name: Install data files
        run: utils\premake5 install_data

      - name: Build client (release, win32)
        run: win-build.bat release win32
        shell: cmd
        env:
          DXSDK_DIR: './utils/DXFiles/'
          CI: 'true'

      - name: Compose install files
        run: utils\premake5 compose_files

      - name: Upload XMP Client artifact
        uses: actions/upload-artifact@v6
        with:
          name: XMP-Client-win32
          path: InstallFiles/
          if-no-files-found: error

      - name: Package client release (zip + manifest, no BOM)
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("xmp-v")
          Compress-Archive -Path InstallFiles\* -DestinationPath XMP-Client-win32.zip -CompressionLevel Optimal
          $hash = (Get-FileHash XMP-Client-win32.zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item XMP-Client-win32.zip).Length
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/XMP-Client-win32.zip"
          $json = @{ version = $version; url = $url; sha256 = $hash; size = $size } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$PWD/xmp-client-manifest.json", $json, (New-Object System.Text.UTF8Encoding($false)))

      - name: Attach client release to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            XMP-Client-win32.zip
            xmp-client-manifest.json

  server-linux:
    name: XMP Server (linux, x64)
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/multitheftauto/mtasa-blue-build:latest
    steps:
      - uses: actions/checkout@v6

      - name: Build server (release, x64)
        run: ./linux-build.sh --arch=x64 --config=release

      - name: Install server data files
        run: ./linux-install-data.sh

      - name: Smoke test (boot + ASE query)
        run: |
          cd Bin/server
          (timeout 25 ./xmp-server64 > /tmp/xmp-smoke.log 2>&1 &)
          sleep 12
          python3 - <<'PY'
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.settimeout(6)
          s.sendto(b's', ('127.0.0.1', 22003 + 123))
          data, _ = s.recvfrom(4096)
          print('ASE response:', data[:100])
          assert data.startswith(b'EYE1'), 'unexpected ASE payload'
          assert b'XMP Server' in data, 'server name is not XMP Server'
          print('SMOKE OK')
          PY

      - name: Upload XMP Server artifact
        uses: actions/upload-artifact@v6
        with:
          name: XMP-Server-linux-x64
          path: Bin/server/
          if-no-files-found: error

      - name: Package server release (tar.gz)
        if: startsWith(github.ref, 'refs/tags/')
        run: tar -czf XMP-Server-linux-x64.tar.gz -C Bin/server .

      - name: Attach server release to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: XMP-Server-linux-x64.tar.gz
